# RBAC: an identity that can LOOK at Pods and their logs in demo-app, and nothing else.
#
#   ServiceAccount = who      (an identity for a program or a person's tooling)
#   Role           = what     (allowed verbs on allowed resources, in ONE namespace)
#   RoleBinding    = who gets what
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: demo-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo-app
rules:
  - apiGroups: [""] # "" = the core API group (Pods, Services, Secrets...)
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-reads-pods
  namespace: demo-app
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: demo-app
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
