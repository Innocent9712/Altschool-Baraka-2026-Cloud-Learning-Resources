# Scale the backend between 2 and 6 Pods, aiming for an average CPU use of 50%
# of each Pod's CPU *request* (100m in 04-backend.yaml, so about 50m per Pod).
# Needs metrics-server installed in the cluster (see the demo README).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: demo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
