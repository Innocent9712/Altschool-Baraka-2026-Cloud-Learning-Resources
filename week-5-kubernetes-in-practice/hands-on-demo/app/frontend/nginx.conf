server {
    listen 8080;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths (e.g. /users/3) return index.html and the
    # React router takes over in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api belongs to the backend: the Ingress routes it there before it reaches us.
    # If an /api request does arrive here, the routing is wrong, so say so with a
    # 404 rather than answering with the HTML page.
    location /api/ {
        return 404;
    }

    # Make browsers check for a new index.html on every visit, so a new release
    # shows up straight after a rollout. The files it links to have a content
    # hash in their names (index-QUrCNdfC.js), so those can be cached safely.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
