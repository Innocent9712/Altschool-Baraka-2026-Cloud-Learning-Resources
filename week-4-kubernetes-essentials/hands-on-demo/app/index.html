<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kubernetes Demo {{VERSION}}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: {{COLOR}}; color: #fff; }
    main { text-align: center; padding: 2rem; }
    .pod { font-family: ui-monospace, monospace; font-size: 1.5rem;
           background: rgba(0,0,0,.25); padding: .5rem 1rem; border-radius: .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Kubernetes ({{VERSION}})</h1>
    <p>This page was served by Pod:</p>
    <p class="pod">{{HOSTNAME}}</p>
    <p>Refresh, or run <code>curl</code> in a loop, to see other Pods answer.</p>
  </main>
</body>
</html>
