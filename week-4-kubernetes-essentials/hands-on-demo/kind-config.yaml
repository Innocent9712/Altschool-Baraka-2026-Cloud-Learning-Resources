# A local 3-node Kubernetes cluster running in Docker containers:
# 1 control-plane node + 2 worker nodes.
#
#   kind create cluster --name k8s-demo --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Forward port 30080 on your machine to NodePort 30080 in the cluster,
    # so the NodePort Service in 03-service.yaml is reachable at http://localhost:30080
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
  - role: worker
  - role: worker
